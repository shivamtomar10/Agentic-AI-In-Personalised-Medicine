services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentic_cdss_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cdss_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdss_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cdss_longitudinal}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cdss_admin} -d ${POSTGRES_DB:-cdss_longitudinal}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
