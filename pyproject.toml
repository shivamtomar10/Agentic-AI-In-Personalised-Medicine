[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-personalized-medicine"
version = "0.3.0"
description = "Longitudinal State-Aware Agentic AI for Personalized Clinical Decision Support (decision support prototype, synthetic data only)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Shivam Tomar" }]
dependencies = [
    "pydantic>=2.7.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
]
# Not used by the in-memory prototype; reserved for the planned Postgres/FHIR work.
postgres = ["psycopg[binary]>=3.1.18", "pgvector>=0.2.5"]
fhir = ["fhir.resources>=7.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "eval*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
