# Labelled (chunk, claim, entailed?) pairs for the evidence linker. `dev` guided the linker improvements; `test` was
# written and frozen BEFORE those improvements and is evaluated once. Author-written: small (n=24 each), not a benchmark.
dev:
  - [EV-FDA-METFORMIN#0, "Metformin should not be used in patients whose eGFR is under 30 mL/min/1.73 m2", true]
  - [EV-FDA-METFORMIN#3, "Metformin has to be stopped if eGFR later drops below 30 mL/min/1.73 m2", true]
  - [EV-FDA-METFORMIN#1, "It is not recommended to start metformin when eGFR is between 30 and 45 mL/min/1.73 m2", true]
  - [EV-KDIGO-DM-CKD-2022-METFORMIN#1, "Metformin dose should be lowered once eGFR falls below 45 mL/min/1.73 m2", true]
  - [EV-KDIGO-DM-CKD-2022-SGLT2#0, "SGLT2 inhibitors are advised for type 2 diabetes with CKD when eGFR is at least 20 mL/min/1.73 m2", true]
  - [EV-LABEL-WARFARIN-NSAID#0, "Taking an NSAID together with warfarin raises bleeding risk", true]
  - [EV-LABEL-WARFARIN-AMIODARONE#0, "Amiodarone can raise the INR in patients on warfarin", true]
  - [EV-LABEL-ACEI-PREGNANCY#1, "ACE inhibitors and ARBs should be stopped as soon as pregnancy is detected", true]
  - [EV-JACI-2022-PENICILLIN#0, "Patients with a documented penicillin allergy should not receive penicillins until they have been evaluated", true]
  - [EV-FDA-DILI-2009#0, "An ALT more than three times the upper limit of normal may signal liver toxicity", true]
  - [EV-CREDIBLEMEDS-QT#1, "Using two or more QT-prolonging drugs together increases the risk of torsades de pointes", true]
  - [EV-ADA-2024-TARGETS#0, "An A1C goal under 7% suits many adults who are not pregnant", true]
  - [EV-FDA-METFORMIN#0, "Metformin is contraindicated when eGFR is below 45 mL/min/1.73 m2", false]
  - [EV-FDA-METFORMIN#0, "Metformin can be used when eGFR is below 30 mL/min/1.73 m2", false]
  - [EV-LABEL-WARFARIN-NSAID#0, "NSAIDs reduce the risk of bleeding when combined with warfarin", false]
  - [EV-LABEL-WARFARIN-AMIODARONE#0, "Amiodarone decreases the anticoagulant effect of warfarin", false]
  - [EV-LABEL-ACEI-PREGNANCY#1, "ACE inhibitors are safe to continue when pregnancy is detected", false]
  - [EV-JACI-2022-PENICILLIN#0, "Penicillins are the preferred treatment for patients with penicillin allergy", false]
  - [EV-FDA-DILI-2009#0, "An ALT elevation above ten times the upper limit of normal is a signal of hepatotoxicity", false]
  - [EV-KDIGO-DM-CKD-2022-SGLT2#0, "SGLT2 inhibitors are recommended when eGFR is 45 mL/min/1.73 m2 or higher", false]
  - [EV-FDA-METFORMIN#3, "Metformin should be discontinued if eGFR falls below 60 mL/min/1.73 m2", false]
  - [EV-CREDIBLEMEDS-QT#1, "Combining QT-prolonging drugs lowers the risk of torsades de pointes", false]
  - [EV-AGS-BEERS-2023#2, "Chronic NSAID use is recommended in older adults", false]
  - [EV-LABEL-ACEI-HYPERK#0, "ACE inhibitors can cause hypokalemia", false]
test:
  - [EV-FDA-METFORMIN#2, "Clinicians should reassess whether to continue metformin when eGFR drops below 45 mL/min/1.73 m2", true]
  - [EV-KDIGO-DM-CKD-2022-METFORMIN#0, "Metformin may be used in type 2 diabetes with CKD provided eGFR is 30 mL/min/1.73 m2 or above", true]
  - [EV-LABEL-WARFARIN-NSAID#1, "Close monitoring is needed when a drug affecting bleeding is added to an anticoagulant", true]
  - [EV-KDIGO-CKD-2024-STAGING#1, "GFR category G4 covers 15 to 29 mL/min/1.73 m2", true]
  - [EV-KDIGO-CKD-2024-HYPERK#1, "The RAS inhibitor regimen and potassium should be reviewed if potassium is high", true]
  - [EV-LABEL-ACEI-HYPERK#1, "Kidney impairment, diabetes and potassium supplements are risk factors", true]
  - [EV-JACI-2022-PENICILLIN#2, "Cephalosporins that have different side chains can frequently be given when needed, with care", true]
  - [EV-FDA-DILI-2009#1, "Clinical review and repeat testing are warranted in patients on a possibly hepatotoxic drug", true]
  - [EV-AGS-BEERS-2023#0, "Adults 65 years and older should generally avoid or cautiously use potentially inappropriate medications listed in the Beers Criteria", true]
  - [EV-ADA-2024-TARGETS#1, "A goal below 8% may suit older adults", true]
  - [EV-CREDIBLEMEDS-QT#1, "Two or more QT-prolonging drugs together raise torsades de pointes risk and should be avoided or monitored with ECG and electrolytes", true]
  - [EV-FDA-METFORMIN#1, "Metformin should not be started when eGFR is between 30 and 45 mL/min/1.73 m2", true]
  - [EV-FDA-METFORMIN#1, "Starting metformin is recommended when eGFR is between 30 and 45 mL/min/1.73 m2", false]
  - [EV-KDIGO-DM-CKD-2022-METFORMIN#1, "Metformin should be stopped when eGFR falls below 45 mL/min/1.73 m2", false]
  - [EV-KDIGO-DM-CKD-2022-SGLT2#1, "The glucose-lowering efficacy of SGLT2 inhibitors is increased at lower eGFR", false]
  - [EV-LABEL-WARFARIN-AMIODARONE#0, "Ibuprofen can increase the anticoagulant effect of warfarin and raise the INR", false]
  - [EV-FDA-DILI-2009#0, "An ALT elevation above the upper limit of normal is a signal of potential hepatotoxicity", false]
  - [EV-LABEL-ACEI-PREGNANCY#1, "ACE inhibitors should be continued when pregnancy is detected", false]
  - [EV-JACI-2022-PENICILLIN#0, "Penicillins should be avoided in patients allergic to cephalosporins", false]
  - [EV-FDA-METFORMIN#3, "Metformin should be discontinued if eGFR later falls below 15 mL/min/1.73 m2", false]
  - [EV-KDIGO-CKD-2024-STAGING#1, "G3b is 45 to 59 mL/min/1.73 m2", false]
  - [EV-CREDIBLEMEDS-QT#1, "Combining two or more QT-prolonging drugs is safe", false]
  - [EV-ADA-2024-TARGETS#0, "An A1C goal below 9% is appropriate for many nonpregnant adults", false]
  - [EV-AGS-BEERS-2023#2, "Chronic NSAID use should be preferred unless alternatives are not effective", false]
# test2: written AFTER the improved linker existed, evaluated once, includes cases the author suspected would still fail.
# (`test` above is contaminated: its baseline errors were seen while designing the improvements.)
test2:
  - [EV-FDA-METFORMIN#0, "Patients with eGFR less than 30 mL/min/1.73 m2 should not take metformin", true]
  - [EV-LABEL-WARFARIN-NSAID#0, "Combining an NSAID with warfarin increases the chance of bleeding", true]
  - [EV-KDIGO-CKD-2024-STAGING#1, "G5 is below 15 mL/min/1.73 m2", true]
  - [EV-LABEL-ACEI-HYPERK#2, "Potassium should be monitored", true]
  - [EV-FDA-DILI-2009#1, "Repeat testing and clinical review are appropriate for a patient on a potentially hepatotoxic drug", true]
  - [EV-KDIGO-CKD-2024-HYPERK#0, "Managing hyperkalemia from RAS inhibitors usually starts with measures that lower potassium", true]
  - [EV-ADA-2024-TARGETS#1, "A goal below 8% may be appropriate for older adults", true]
  - [EV-AGS-BEERS-2023#2, "Chronic NSAID use should be avoided unless alternatives are not effective", true]
  - [EV-KDIGO-CKD-2024-STAGING#1, "G2 is 60 to 89 mL/min/1.73 m2", true]
  - [EV-FDA-METFORMIN#0, "Metformin is contraindicated in patients with an eGFR above 30 mL/min/1.73 m2", false]
  - [EV-LABEL-WARFARIN-AMIODARONE#0, "Amiodarone can increase the anticoagulant effect of ibuprofen", false]
  - [EV-JACI-2022-PENICILLIN#1, "Cross-reactivity between penicillins and cephalosporins is high overall", false]
  - [EV-KDIGO-DM-CKD-2022-SGLT2#0, "SGLT2 inhibitors are recommended for patients with type 1 diabetes, CKD and an eGFR of 20 mL/min/1.73 m2 or higher", false]
  - [EV-FDA-METFORMIN#3, "Metformin should be discontinued if eGFR later rises above 30 mL/min/1.73 m2", false]
  - [EV-CREDIBLEMEDS-QT#1, "Combining two or more QT-prolonging drugs raises the risk of torsades de pointes and should be encouraged", false]
  - [EV-KDIGO-CKD-2024-STAGING#1, "G2 is 60 to 90 mL/min/1.73 m2", false]
