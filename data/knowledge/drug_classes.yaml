# allergy keyword -> (classes with definite conflict, classes with possible cross-reactivity)
allergy_map:
  penicillin: {definite: [penicillin], possible: [cephalosporin]}
  amoxicillin: {definite: [penicillin], possible: [cephalosporin]}
  beta-lactam: {definite: [penicillin, cephalosporin], possible: []}
  cephalosporin: {definite: [cephalosporin], possible: []}
  sulfa: {definite: [sulfonamide_antibiotic], possible: []}
  sulfonamide: {definite: [sulfonamide_antibiotic], possible: []}
  nsaid: {definite: [nsaid], possible: []}
  aspirin: {definite: [antiplatelet_aspirin], possible: [nsaid]}
# interaction rules by class pair. evidence = topic id in the evidence corpus.
interaction_rules:
  - {a: anticoagulant, b: nsaid, severity: high, effect: "Increased bleeding risk", topic: warfarin_nsaid}
  - {a: anticoagulant, b: antiplatelet, severity: moderate, effect: "Increased bleeding risk", topic: warfarin_nsaid}
  - {a: warfarin, b: amiodarone, severity: high, effect: "Amiodarone raises warfarin effect (INR)", topic: warfarin_amiodarone}
  - {a: raas_inhibitor, b: potassium_raising, severity: high, effect: "Hyperkalaemia risk", topic: hyperkalemia_rasi}
  - {a: qt_prolonging, b: qt_prolonging, severity: high, effect: "Additive QT prolongation / torsades de pointes risk", topic: qt_additive}
  - {a: statin, b: fibrate, severity: high, effect: "Severe myopathy and rhabdomyolysis risk", topic: statin_fibrate}
  - {a: nsaid, b: ssri, severity: moderate, effect: "Additive upper gastrointestinal bleeding risk", topic: nsaid_ssri}
  - {a: ace_inhibitor, b: arb, severity: high, effect: "Dual RAAS blockade: increased hyperkalemia, AKI and hypotension risk without clinical benefit", topic: raas_dual}
  - {a: methotrexate, b: nsaid, severity: high, effect: "Reduced renal clearance of methotrexate leading to bone marrow toxicity", topic: methotrexate_nsaid}
