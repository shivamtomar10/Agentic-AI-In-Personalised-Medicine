<!--meta title="Choose a new password" description="Choose a new password for your account." script="auth.js" nav="" robots="noindex" -->
<div class="wrap auth" data-auth="reset">
  <section class="auth-card" aria-labelledby="h">
    <h1 id="h">Choose a new password</h1>
    <div id="bad-link" hidden><div class="notice bad" role="alert"><p>This reset link has expired or was already used.</p></div><a class="btn" href="/forgot-password">Request a new link</a></div>
    <form id="form" novalidate hidden>
      <div id="form-msg" tabindex="-1"></div>
      <div class="field"><label for="new_password">New password <span class="hint">At least 10 characters.</span></label>
        <div class="pw-wrap"><input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="10" required><button type="button" class="btn btn-plain btn-sm pw-toggle" aria-controls="new_password" aria-pressed="false">Show</button></div>
        <div class="meter" aria-hidden="true"><i id="meter"></i></div><div class="fine" id="meter-label" aria-live="polite"></div></div>
      <button class="btn" type="submit" style="width:100%">Save new password</button>
    </form>
  </section>
  <aside class="auth-aside"><h2>After you save</h2><p>You will be signed out of every device and can sign in with the new password straight away.</p></aside>
</div>
